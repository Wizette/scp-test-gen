<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCP Test Prep – Stats</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Verdana, Arial, Helvetica, sans-serif;
  font-size: 14px;
  color: rgb(69, 79, 89);
  background: rgb(245, 245, 245);
  line-height: 1.5;
}
.container { max-width: 700px; margin: 0 auto; padding: 20px 16px; }
.card {
  background: #fff;
  border: 1px solid rgb(217, 218, 218);
  border-radius: 4px;
  padding: 24px 20px;
  margin-bottom: 16px;
}
h1 { font-size: 20px; margin-bottom: 4px; text-align: center; }
h2 { font-size: 15px; margin-bottom: 12px; color: rgb(69, 79, 89); }
.subtitle { text-align: center; color: rgb(140, 140, 140); font-size: 12px; margin-bottom: 20px; }

/* Stats grid */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 12px;
  margin-bottom: 8px;
}
.stat-box {
  text-align: center;
  padding: 14px 8px;
  background: rgb(245, 245, 245);
  border-radius: 6px;
}
.stat-box .val { font-size: 22px; font-weight: bold; color: rgb(69, 79, 89); }
.stat-box .lbl { font-size: 11px; color: rgb(140, 140, 140); margin-top: 2px; }

/* Mode breakdown bar */
.mode-bar { display: flex; height: 24px; border-radius: 4px; overflow: hidden; margin: 8px 0 4px; }
.mode-bar .exam-seg { background: #3b82f6; }
.mode-bar .practice-seg { background: #22c55e; }
.mode-legend { display: flex; gap: 16px; font-size: 11px; color: rgb(120,120,120); margin-bottom: 4px; }
.mode-legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
.mode-legend .exam::before { background: #3b82f6; }
.mode-legend .practice::before { background: #22c55e; }

/* Wrong questions table */
.wrong-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.wrong-table th { text-align: left; font-weight: bold; padding: 6px 8px; border-bottom: 2px solid rgb(217,218,218); font-size: 12px; color: rgb(120,120,120); }
.wrong-table td { padding: 6px 8px; border-bottom: 1px solid rgb(240,240,240); }
.wrong-table tr:hover td { background: rgb(250,250,250); }
.wrong-count { font-weight: bold; color: #dc2626; text-align: center; min-width: 36px; }

/* History table */
.history-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.history-table th { text-align: left; font-weight: bold; padding: 6px 8px; border-bottom: 2px solid rgb(217,218,218); font-size: 11px; color: rgb(120,120,120); }
.history-table td { padding: 6px 8px; border-bottom: 1px solid rgb(240,240,240); }
.history-table tr:hover td { background: rgb(250,250,250); }

/* Buttons */
.btn { display: inline-block; padding: 8px 18px; border: none; border-radius: 4px; font-family: inherit; font-size: 13px; cursor: pointer; }
.btn-danger { background: #dc2626; color: #fff; }
.btn-danger:hover { background: #b91c1c; }
.btn-outline { background: transparent; border: 1px solid rgb(217,218,218); color: rgb(100,100,100); }
.btn-outline:hover { background: rgb(245,245,245); }
.btn-row { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }

.empty-msg { text-align: center; color: rgb(160,160,160); padding: 30px 10px; font-size: 13px; }

/* Narrow screens: force the data tables to fit instead of overflowing the page. */
@media (max-width: 480px) {
  .container { padding: 12px 10px; }
  .card { padding: 20px 14px; }
  .wrong-table, .history-table { table-layout: fixed; }
  .wrong-table th, .wrong-table td,
  .history-table th, .history-table td { padding: 6px 4px; overflow-wrap: anywhere; }
  .history-table { font-size: 11px; }
  .wrong-count { min-width: 0; }
}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>Usage Stats</h1>
    <p class="subtitle">Per-device tracking (localStorage) &middot; Not shared across browsers</p>
  </div>

  <!-- Overview -->
  <div class="card" id="overview-card">
    <h2>Overview</h2>
    <div class="stat-grid" id="stat-grid"></div>
  </div>

  <!-- Mode Breakdown -->
  <div class="card" id="mode-card">
    <h2>Mode Breakdown</h2>
    <div class="mode-bar" id="mode-bar"></div>
    <div class="mode-legend">
      <span class="exam">Exam</span>
      <span class="practice">Practice</span>
    </div>
  </div>

  <!-- Most-Missed Questions -->
  <div class="card" id="wrong-card">
    <h2>Most-Missed Questions</h2>
    <div id="wrong-list"></div>
  </div>

  <!-- Recent History -->
  <div class="card" id="history-card">
    <h2>Recent Test History</h2>
    <div id="history-list"></div>
  </div>

  <!-- Actions -->
  <div class="card">
    <div class="btn-row">
      <button class="btn btn-outline" onclick="backToTest()">Back to Test</button>
      <button class="btn btn-danger" onclick="clearStats()">Clear All Stats</button>
    </div>
  </div>
</div>

<script>
// Stats are deliberately scoped to the selected bank.  The legacy keys are read-only
// compatibility data for Z17; they are never migrated, overwritten, or removed here.
let questionsMap = {};
let selectedTest = 'Z18';
let selectedBankVersion = '';
let usingLegacyStats = false;

function canonicalTest(value) {
  const s = String(value || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '').replace(/-TEST$/, '');
  return s === 'Z17' || s === 'Z18' ? s : 'Z18';
}
function queryValue(name) {
  try { return new URLSearchParams(window.location.search).get(name) || ''; } catch (e) { return ''; }
}
function chooseTest() {
  let value = queryValue('test') || queryValue('selectedTest');
  if (!value) { try { value = localStorage.getItem('selectedTest') || ''; } catch (e) {} }
  return canonicalTest(value);
}
function backToTest() { location.href = 'index.html?test=' + selectedTest.toLowerCase() + '-test'; }
function bankUrl(test) { return 'tests/' + test.toLowerCase() + '-test.json'; }
function arrayOf(value) { return Array.isArray(value) ? value : []; }
function safeJson(value, fallback) {
  try { const parsed = JSON.parse(value); return parsed == null ? fallback : parsed; } catch (e) { return fallback; }
}
async function loadQuestions() {
  selectedTest = chooseTest();
  try {
    const res = await fetch(bankUrl(selectedTest));
    if (!res.ok) throw new Error('bank unavailable');
    const data = await res.json();
    selectedBankVersion = String(data.bankVersion || (data.testConfig || {}).bankVersion || data.version || '');
    const qs = arrayOf(data.questions || data.items || data.questionBank);
    questionsMap = {};
    qs.forEach(q => { const id = q && q.id != null ? String(q.id) : ''; if (id) questionsMap[id] = { text: cleanMarkup(q.text || q.prompt || id), type: q.type }; });
  } catch (e) { questionsMap = {}; }
}
function eventMatches(e, allowUnstamped) {
  if (!e || typeof e !== 'object') return false;
  const d = e.data && typeof e.data === 'object' ? e.data : e;
  const test = d.test || d.selectedTest || e.test || e.selectedTest;
  const version = d.bankVersion || e.bankVersion;
  if (test && canonicalTest(test) !== selectedTest) return false;
  if (selectedBankVersion && version && String(version) !== selectedBankVersion) return false;
  return allowUnstamped || !!test || !!version;
}
function namespacedKeys(base) {
  const keys = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i) || '';
      if (k === base) continue;
      if (k.indexOf(base + ':') === 0 || k.indexOf(base + '_') === 0) {
        const tail = k.slice(base.length + 1).toUpperCase();
        if (tail.indexOf(selectedTest) >= 0 || (selectedBankVersion && tail.indexOf(selectedBankVersion.toUpperCase()) >= 0)) keys.push(k);
      }
    }
  } catch (e) {}
  return keys;
}
function readScoped(base, fallback) {
  let found = false, result = [];
  const keys = namespacedKeys(base);
  try {
    for (const key of keys) { const value = safeJson(localStorage.getItem(key), null); if (value !== null) { found = true; result = result.concat(Array.isArray(value) ? value : [value]); } }
  } catch (e) {}
  if (!found && selectedTest === 'Z17') { usingLegacyStats = true; try { const legacy = safeJson(localStorage.getItem(base), fallback); result = Array.isArray(legacy) ? legacy : (legacy && typeof legacy === 'object' ? [legacy] : []); } catch (e) { result = []; } }
  return { found, value: result };
}
function getLog() {
  usingLegacyStats = false;
  const r = readScoped('scp_stats', []);
  return r.value.filter(e => eventMatches(e, usingLegacyStats));
}
function getWrong() {
  const r = readScoped('scp_stats_wrong', {}), out = {};
  for (const item of r.value) {
    if (!item || typeof item !== 'object') continue;
    const source = item.wrong && typeof item.wrong === 'object' ? item.wrong : item;
    if (!item.test && !item.selectedTest && !item.bankVersion && !r.found && selectedTest !== 'Z17') continue;
    if (!eventMatches(item, !r.found && selectedTest === 'Z17')) continue;
    for (const [id, count] of Object.entries(source)) if (/^\w[\w-]*$/.test(id) && Number.isFinite(Number(count))) out[String(id)] = (out[String(id)] || 0) + Number(count);
  }
  return out;
}
function dataOf(e) { return e && e.data && typeof e.data === 'object' ? e.data : {}; }
function isProvisional(e) { const d=dataOf(e); return d.provisional === true || e.status === 'provisional' || d.status === 'provisional'; }
function isFinal(e) { return !isProvisional(e) && (e.status === undefined || e.status === 'final' || dataOf(e).status === undefined || dataOf(e).status === 'final'); }
function renderStats() {
  const log = getLog(), wrong = getWrong();
  const visits=log.filter(e=>e.type==='visit').length, starts=log.filter(e=>e.type==='test_start').length;
  const allCompletions=log.filter(e=>e.type==='test_complete'), completions=allCompletions.filter(isFinal), completed=completions.length;
  let avgScore=0, avgPct=0, avgTime=0, passCount=0;
  if (completed) { avgPct=Math.round(completions.reduce((s,e)=>s+Number(dataOf(e).pct||0),0)/completed); avgScore=(completions.reduce((s,e)=>s+Number(dataOf(e).score||0),0)/completed).toFixed(1); avgTime=Math.round(completions.reduce((s,e)=>s+Number(dataOf(e).duration||0),0)/completed); passCount=completions.filter(e=>Number(dataOf(e).pct||0)>=70).length; }
  const examStarts=log.filter(e=>e.type==='test_start'&&dataOf(e).mode==='exam').length, practiceStarts=log.filter(e=>e.type==='test_start'&&dataOf(e).mode==='practice').length;
  document.getElementById('stat-grid').innerHTML=[{val:visits,lbl:'Visits'},{val:starts,lbl:'Tests Started'},{val:completed,lbl:'Tests Completed'},{val:completed?avgPct+'%':'—',lbl:'Avg Score'},{val:completed?passCount+'/'+completed:'—',lbl:'Pass Rate (≥70%)'},{val:completed?fmtTime(avgTime):'—',lbl:'Avg Time'}].map(s=>'<div class="stat-box"><div class="val">'+escHtml(String(s.val))+'</div><div class="lbl">'+s.lbl+'</div></div>').join('');
  const total=examStarts+practiceStarts, bar=document.getElementById('mode-bar');
  bar.innerHTML=total?'<div class="exam-seg" style="width:'+Math.round(examStarts/total*100)+'%" title="Exam: '+examStarts+'"></div><div class="practice-seg" style="width:'+(100-Math.round(examStarts/total*100))+'%" title="Practice: '+practiceStarts+'"></div>':'<div style="width:100%;background:rgb(230,230,230);"></div>';
  const entries=Object.entries(wrong).sort((a,b)=>b[1]-a[1]).slice(0,10), wl=document.getElementById('wrong-list');
  wl.innerHTML=entries.length?'<table class="wrong-table"><thead><tr><th>#</th><th>Question</th><th>Wrong</th></tr></thead><tbody>'+entries.map(([id,n],i)=>'<tr><td>'+ (i+1)+'</td><td>'+escHtml((questionsMap[id]?.text||id).slice(0,100))+'</td><td class="wrong-count">'+n+'</td></tr>').join('')+'</tbody></table>':'<p class="empty-msg">No wrong answers recorded yet.</p>';
  const hl=document.getElementById('history-list'), recent=allCompletions.slice(-20).reverse();
  hl.innerHTML=recent.length?'<table class="history-table"><thead><tr><th>Date</th><th>Mode</th><th>Score</th><th>Time</th><th>Answered</th></tr></thead><tbody>'+recent.map(e=>{const d=dataOf(e), date=new Date(e.ts); return '<tr><td>'+escHtml(isNaN(date)?'Unknown':date.toLocaleDateString()+' '+date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))+'</td><td>'+escHtml((d.mode||'exam').toString())+(isProvisional(e)?' (provisional)':'')+'</td><td>'+Number(d.pct||0)+'%</td><td>'+fmtTime(Number(d.duration||0))+'</td><td>'+Number(d.answered||0)+'/'+(d.total||'?')+'</td></tr>';}).join('')+'</tbody></table>':'<p class="empty-msg">No completed tests yet.</p>';
  const TEST_LABELS={Z17:"Z17 · Hilchos Hafrashas Challah & Terumos U'Ma'asros",Z18:'Z18 · Hilchot Tzitzit'};
  const links=Object.keys(TEST_LABELS).map(t=>t===selectedTest
    ? '<strong>'+escHtml(TEST_LABELS[t])+'</strong>'
    : '<a href="stats.html?test='+t+'">'+escHtml(TEST_LABELS[t])+'</a>').join(' · ');
  document.querySelector('.subtitle').innerHTML='Viewing: '+links+' · '+(usingLegacyStats?'legacy Z17 data':'namespaced data');
}
function clearStats() { if(!confirm('Clear stats for '+selectedTest+'?')) return; try { for(const k of namespacedKeys('scp_stats').concat(namespacedKeys('scp_stats_wrong'))) localStorage.removeItem(k); } catch(e) {} renderStats(); }
function fmtTime(sec) { sec=Math.max(0,Number(sec)||0); return String(Math.floor(sec/3600)).padStart(2,'0')+':'+String(Math.floor(sec%3600/60)).padStart(2,'0')+':'+String(Math.floor(sec%60)).padStart(2,'0'); }
function escHtml(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
/* Strips Pandoc/Markdown residue left in banks generated from .docx sources. */
function cleanMarkup(s) {
  let t = String(s == null ? '' : s);
  t = t.replace(/!\[[^\]]*\]\([^)]*\)/g, '');
  t = t.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');
  for (let i = 0; i < 5; i++) {
    const next = t.replace(/\[([^[\]]*)\]\{[^{}]*\}/g, '$1');
    if (next === t) break;
    t = next;
  }
  t = t.replace(/\{[^{}]*\}/g, '')
       .replace(/\[\^[^\]]*\]/g, '')
       .replace(/(\S)\^\d+/g, '$1')
       .replace(/\*\*\*([^*]+)\*\*\*/g, '$1')
       .replace(/\*\*([^*]+)\*\*/g, '$1')
       .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1$2')
       .replace(/(^|\s)_([^_\n]+)_(?=\s|$)/g, '$1$2')
       .replace(/`+/g, '')
       .replace(/\\([\\`*_{}[\]()#+\-.!>])/g, '$1')
       .replace(/^[ \t]*>[ \t]?/gm, '')
       .replace(/\s--+\s/g, ' \u2014 ')
       .replace(/\s+/g, ' ').trim();
  return t.replace(/^[\s\-–—:;,.)\]]+/, '').trim();
}
loadQuestions().then(renderStats);
</script>
</body>
</html>
